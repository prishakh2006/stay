{% extends 'base.html' %}
{% block title %}Log in | Blue Orchid{% endblock %}
{% block content %}
<section class="page-intro">
	<p class="eyebrow">WELCOME BACK</p>
	<h1>Log in</h1>
	<p>Access your Blue Orchid account and reservation details.</p>
</section>
<section class="panel auth-panel">
	<form method="post" class="form-grid single">
		<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
		<input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
		<label>Username<input name="username" autocomplete="username" maxlength="80" required></label>
		<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
		<button type="submit">Log in</button>
	</form>
	<p class="form-note">New customer? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</section>
{% endblock %}
